<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Teste</title>
    <style>
        * {
            text-align: center;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
        }

        img {
            width: 300px;
            height: 200px;
        }

        .para1 {
            font-family: comic sans-serif;
            color: hotpink;
        }

        h2 {
            border: 2px solid goldenrod;
        }
        .h2 {
            font-family: comic sans-serif;
            color: green;
            text-decoration: underline;
        }
        .para2 {
            text-decoration: underline;
            font-style: italic;
            color: red;
            background-color: blue;
            font-size: 50px;
        }
        hr {
            border: 10px solid black;
        }
        .hr1 {
            height: 1px;
        }
        .background {
            background-color: blue;
        }
        .pink {
            color: salmon;
        }
    </style>
</head>

<body>
    <h1>PÁGINA TESTE CSS</h1>
    <hr>
    <img src="_images/css01.jpg">
    <img src="_images/css02.jpg">
    <img src="_images/css03.png">
    <img src="_images/css04.png">
    <hr class="hr1">
    <h1 class="pink">CSS É VIDA!</h1>
    <p>Diversas possibilidades de incrementar seu HTML</p>
    <h1>Exemplos de Cores no CSS</h1>
    <p class="background">Exemplo de texto com cor de fundo</p>
    <hr>
    <p class="para1">Exemplo de texto com mudança da cor da fonte</p>
    <hr class="hr1">
    <h2>Exemplo de texto com borda colorida</h2>
    <h1><b>Misturando tudo</b></h1>
    <h2 class="h2">Exemplo de texto com várias formatações</h2>
    <hr class="hr1">
    <h2 class="para2">Mais um exemplo</h2>
</body>

</html>
